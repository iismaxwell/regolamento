# Renderizza il libro Quarto (sito, PDF, DOCX) e pubblica.
# - push su main: pubblica il sito su GitHub Pages.
# - tag v*: allega PDF e DOCX come artefatti della release.
name: Pubblica sito
on:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: quarto-dev/quarto-actions/setup@v2
      # Due corse, in quest'ordine: la prima genera il sito e ripulisce _book/,
      # la seconda vi aggiunge PDF e DOCX (--no-clean, altrimenti cancellerebbe
      # il sito appena prodotto). I due profili sono in _quarto-sito.yml e
      # _quarto-stampa.yml; v. README § Come si genera.
      - run: quarto render
      - run: quarto render --profile stampa --no-clean
      - uses: actions/upload-artifact@v7
        with:
          name: book
          path: _book
          retention-days: 1

  deploy-pages:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: book
          path: _book
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _book
      - uses: actions/deploy-pages@v5

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: book
          path: _book
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            _book/regolamento-maxwell.pdf
            _book/regolamento-maxwell.docx
