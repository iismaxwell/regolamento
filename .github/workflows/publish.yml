# Renderizza il libro Quarto (sito, PDF, DOCX) e pubblica.
# - push su main: pubblica il sito su GitHub Pages.
# - tag v*: allega PDF e DOCX come artefatti della release.
name: Pubblica sito
on:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - run: quarto render
      - uses: actions/upload-artifact@v4
        with:
          name: book
          path: _book
          retention-days: 1

  deploy-pages:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: book
          path: _book
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _book
      - uses: actions/deploy-pages@v4

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: book
          path: _book
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            _book/regolamento-maxwell.pdf
            _book/regolamento-maxwell.docx
